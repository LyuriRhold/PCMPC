name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcmpc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      PG_MODE: external
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pcmpc
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/pcmpc_test
      AUTH_SECRET: ci-only-auth-secret-not-used-in-prod
      CRON_SECRET: ci-only-cron-secret-not-used-in-prod
      APP_TZ: Asia/Manila
      APP_ENV: ci
      APP_URL: http://localhost:3000
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create databases
        run: npm run db:up
      - name: Migrate
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Gate (typecheck, lint, test, scan)
        run: npm run gate
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
